[package]
name = "eutherus-kernel"
version = "0.0.1"
edition = "2024"

[dependencies]
regis-memory = { path = "../regis-memory", optional = true }
regis-scene = { path = "../regis-scene", optional = true }
uefi = { version = "=0.40.0", default-features = false }

[build-dependencies]
fontdue = "=0.9.3"

[features]
graphics = ["dep:regis-scene", "tasks"]
fault-graphics-counter-low = ["graphics"]
fault-graphics-counter-high = ["graphics"]
fault-graphics-input-exit = ["graphics"]
fault-graphics-input-guard = ["graphics"]
paging = ["memory"]
tasks = ["paging"]
fault-task0-low = ["tasks"]
fault-task0-high = ["tasks"]
fault-task1-low = ["tasks"]
fault-task1-high = ["tasks"]
fault-task-overflow = ["tasks"]
fault-guard-low = ["paging"]
fault-guard-high = ["paging"]
fault-emergency-low = ["paging"]
fault-emergency-high = ["paging"]
fault-stack-overflow = ["paging"]
memory = ["interrupts", "dep:regis-memory"]
fault-memory-empty = ["memory"]
fault-memory-invalid = ["memory"]
interrupts = []
fault-timer-masked = ["interrupts"]
fault-invalid-opcode = ["interrupts"]
fault-page-fault = ["interrupts"]
fault-general-protection = ["interrupts"]
fault-double-fault = ["interrupts"]
fault-panic = []
fault-timeout = []
fault-crash = []
